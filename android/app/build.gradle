apply plugin: "com.android.application"
apply plugin: "kotlin-android"
// Required for the kotlinx.android.synthetic.* imports used in DoubleCamera3.kt
// (Kotlin Android Extensions; still available on Kotlin 1.6.x).
apply plugin: "kotlin-android-extensions"

import com.android.build.OutputFile

apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle")

// React Native 0.70 bundles & embeds the JS for release via this legacy script (reads
// project.ext.react). It registers bundleReleaseJsAndAssets, which compiles index.android.bundle
// (Hermes bytecode) into the APK assets so the app runs standalone without Metro.
project.ext.react = [
    enableHermes: true
]

apply from: "../../node_modules/react-native/react.gradle"

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC). Ignored when Hermes is on.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Whether the New Architecture is enabled (gradle property `newArchEnabled`).
 * Generates the IS_NEW_ARCHITECTURE_ENABLED BuildConfig field that
 * MainApplication/MainActivity read. Kept false (see gradle.properties).
 */
def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.principal"

    defaultConfig {
        applicationId "com.principal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }

    /**
     * AnReal keeps its source in the repository-root folders documented in the paper:
     *   - main/  -> native Android (manifest, Kotlin/Java, resources)
     *   - src/   -> React Native (TypeScript), bundled by Metro
     * Instead of moving those files into the conventional android/app/src/main path,
     * we point the Android source sets at them.
     */
    sourceSets {
        main {
            manifest.srcFile "../../main/AndroidManifest.xml"
            java.srcDirs = ["../../main/java"]
            res.srcDirs = ["../../main/res"]
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation("com.facebook.react:react-native:+")
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"
    implementation "androidx.appcompat:appcompat:1.4.1"
    implementation "androidx.core:core-ktx:1.7.0"
    implementation "androidx.activity:activity-ktx:1.4.0"
    // activity_main.xml uses androidx.constraintlayout.widget.ConstraintLayout
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true"
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true"
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true"

    if (isGifEnabled) {
        implementation 'com.facebook.fresco:animated-gif:2.5.0'
    }
    if (isWebpEnabled) {
        implementation 'com.facebook.fresco:webpsupport:2.5.0'
        if (isWebpAnimatedEnabled) {
            implementation 'com.facebook.fresco:animated-webp:2.5.0'
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-engine:+") {
            exclude group:'com.facebook.fbjni'
        }
    } else {
        implementation jscFlavor
    }
}

apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

// New Architecture is disabled, so the app must NOT compile the codegen-generated view-manager
// delegates/interfaces under com.facebook.react.viewmanagers: React Native core and the autolinked
// libraries (safe-area-context, screens, gesture-handler) already ship their own compiled copies.
// Compiling them here causes "Type ... is defined multiple times" when dex-merging a release build.
// These classes are only used by Fabric (new architecture), so excluding them is safe for old arch.
tasks.withType(JavaCompile).configureEach {
    exclude "**/com/facebook/react/viewmanagers/**"
    exclude "**/com/facebook/fbreact/specs/**"
}
