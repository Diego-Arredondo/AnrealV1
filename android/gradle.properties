# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Architectures to build native code for.
# Limited to arm64-v8a (the test device, Samsung S21 FE) to speed up the native C++ build.
# Add armeabi-v7a,x86,x86_64 back if you need to target other devices/emulators.
reactNativeArchitectures=arm64-v8a

# Use Hermes as the JS engine.
hermesEnabled=true
expo.jsEngine=hermes

# New Architecture is DISABLED on purpose. With it off, the files in
# main/jni and main/java/com/principal/newarchitecture are kept (as published)
# but are not part of the active build, which avoids the fragile codegen/CMake wiring.
newArchEnabled=false

# Flipper version (debug only).
FLIPPER_VERSION=0.125.0

# Enable GIF/WebP support in Fresco (optional).
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false
